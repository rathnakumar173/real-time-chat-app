<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
    <style>
        #chat {
          background: #f8f9fa;
          border-radius: 10px;
          padding: 12px;
        }

        .message-row {
          display: flex;
          margin-bottom: 8px;
        }

        .message-bubble {
          max-width: 70%;
          padding: 8px 12px;
          border-radius: 15px;
          font-size: 15px;
        }

        .my-message {
          margin-left: auto;
          background-color: #0d6efd;
          color: white;
          border-bottom-right-radius: 0;
        }

        .other-message {
          margin-right: auto;
          background-color: #e9ecef;
          color: #000;
          border-bottom-left-radius: 0;
        }

        .sender-label {
          font-size: 11px;
          opacity: 0.7;
          margin-bottom: 2px;
        }
    </style>

</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Real-Time Chat Application</h1>

    <div id="chat" class="border rounded p-3 mb-3" style="height:300px; overflow-y:auto"></div>

    <div class="input-group mb-3">
        <input id="senderInput" type="text" class="form-control" placeholder="Your name..." />
    </div>

    <div class="input-group mb-3">
        <input id="messageInput" type="text" class="form-control" placeholder="Type a message..." />
        <div class="input-group-append">
            <button id="sendMessage" class="btn btn-primary">send</button>
        </div>
    </div>
</div>

<script>
    let stompClient = null;
    let currentUser = null;

    function setConnected(connected) {
      document.getElementById('sendMessage').disabled = !connected;
    }

    function connect() {
      currentUser = document.getElementById('senderInput').value.trim() || "User";

      const socket = new SockJS('/ws');
      stompClient = StompJs.Stomp.over(socket);
      stompClient.debug = function () {}; // silence logs

      stompClient.connect({}, function(frame) {
        setConnected(true);
        stompClient.subscribe('/topic/messages', function(message) {
          showMessage(JSON.parse(message.body));
        });
      });
    }

    function showMessage(message) {
  const chat = document.getElementById('chat');
  const messageRow = document.createElement('div');
  const bubble = document.createElement('div');
  const sender = document.createElement('div');
  const time = document.createElement('div');

  messageRow.className = "message-row";
  bubble.className = "message-bubble " + (message.sender === currentUser ? "my-message" : "other-message");
  sender.className = "sender-label";

  sender.textContent = message.sender;
  bubble.textContent = message.content;

  time.style.fontSize = "10px";
  time.style.opacity = "0.6";
  time.style.marginTop = "2px";
  time.textContent = message.timestamp || ""; // fallback if older messages lack timestamp

  bubble.appendChild(time);

  messageRow.appendChild(sender);
  messageRow.appendChild(bubble);

  chat.appendChild(messageRow);
  chat.scrollTop = chat.scrollHeight;
}


    function sendMessage() {
  const sender = document.getElementById('senderInput').value.trim();
  const content = document.getElementById('messageInput').value.trim();
  if (!sender || !content) return;

  // ✅ create timestamp
  const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const chatMessage = { sender, content, timestamp };
  stompClient.send('/app/sendMessage', {}, JSON.stringify(chatMessage));

  document.getElementById('messageInput').value = '';
}


    document.getElementById('sendMessage').onclick = sendMessage;
    window.onload = connect;
</script>

</body>
</html>
